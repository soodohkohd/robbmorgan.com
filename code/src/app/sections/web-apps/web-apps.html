<app-section-shell
  eyebrow="From the keyboard"
  title="Code"
  lede="Pick a project below — each one expands with details, repo / package links, and the design thinking behind it."
>
  <img
    slot="icon"
    class="portrait-icon"
    src="/robb-morgan.webp"
    alt="Robb Morgan - Code"
    title="Robb Morgan - Code"
  />

  <!-- Topic selector -->
  <div class="topic-tabs" role="tablist" aria-label="Code topics">
    @for (topic of topics; track topic.slug) {
      <button
        type="button"
        class="topic-tab"
        role="tab"
        [class.is-wip]="topic.wip"
        [class.is-active]="selectedSlug() === topic.slug"
        [attr.aria-selected]="selectedSlug() === topic.slug"
        (click)="select(topic.slug)"
      >{{ topic.wip ? 'Current Project: ' + topic.label : topic.label }}</button>
    }
  </div>

  <!-- Selected topic content -->
  <article class="topic" [attr.data-topic]="selectedSlug()">
    <h2 class="topic-title">{{ selectedTopic().label }}</h2>
    @if (selectedTopic().intro) {
      <p class="topic-intro" [innerHTML]="selectedTopic().intro"></p>
    }

    @if (selectedSlug() === 'epic-pipeline') {
      <!-- EPIC component sub-tabs (pipeline / web / api / modules) -->
      <div class="epic-subtabs" role="tablist" aria-label="EPIC components">
        @for (tab of epicTabs; track tab.slug) {
          <button
            type="button"
            class="epic-subtab"
            role="tab"
            [class.is-active]="selectedEpicSlug() === tab.slug"
            [attr.aria-selected]="selectedEpicSlug() === tab.slug"
            (click)="selectEpic(tab.slug)"
          >{{ tab.label }}</button>
        }
      </div>
      <div class="topic-body" [innerHTML]="selectedEpicTab().bodyHtml"></div>
    } @else if (selectedSlug() === 'nine') {
      <!-- NINE sub-tabs (overview / models / custom models / agent / memory / runtime) -->
      <div class="epic-subtabs" role="tablist" aria-label="NINE topics">
        @for (tab of nineTabs; track tab.slug) {
          <button
            type="button"
            class="epic-subtab"
            role="tab"
            [class.is-active]="selectedNineSlug() === tab.slug"
            [attr.aria-selected]="selectedNineSlug() === tab.slug"
            (click)="selectNine(tab.slug)"
          >{{ tab.label }}</button>
        }
      </div>
      <div class="topic-body" [innerHTML]="selectedNineTab().bodyHtml"></div>
    } @else {
      <div class="topic-body" [innerHTML]="selectedTopic().bodyHtml"></div>
    }
  </article>
</app-section-shell>
